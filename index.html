             start,\n              goal,\n              type: challengeType,\n              solvedPath,\n              waypoints,\n              decoys,\n              targetColor: '#6366f1'\n            };\n          }\n        }\n\n        return LevelGenerator.buildFallbackLevel(cols, rows, challengeType);\n      }\n\n      static findPath(grid, cols, rows, start, goal) {\n        const queue = [[start]];\n        const visited = new Set();\n        visited.add(`${start.c},${start.r}`);\n\n        const dirs = [\n          { dc: 1, dr: 0 }, { dc: -1, dr: 0 },\n          { dc: 0, dr: 1 }, { dc: 0, dr: -1 }\n        ];\n\n        while (queue.length > 0) {\n          const path = queue.shift();\n          const current = path[path.length - 1];\n\n          if (current.c === goal.c && current.r === goal.r) {\n            return path;\n          }\n\n          for (const d of dirs) {\n            const nc = current.c + d.dc;\n            const nr = current.r + d.dr;\n            const key = `${nc},${nr}`;\n\n            if (nc >= 0 && nc < cols && nr >= 0 && nr < rows) {\n              if (grid[nr][nc] === 0 && !visited.has(key)) {\n                visited.add(key);\n                queue.push([...path, { c: nc, r: nr }]);\n              }\n            }\n          }\n        }\n        return null;\n      }\n\n      static buildFallbackLevel(cols, rows, type) {\n        const grid = Array.from({ length: rows }, () => new Array(cols).fill(0));\n        const start = { c: 1, r: Math.floor(rows / 2) };\n        const goal = { c: cols - 2, r: Math.floor(rows / 2) };\n        for (let r = 0; r < rows; r++) {\n          if (r !== 2 && r !== rows - 3) {\n            grid[r][Math.floor(cols / 2)] = 1;\n          }\n        }\n        const solvedPath = LevelGenerator.findPath(grid, cols, rows, start, goal);\n        return {\n          cols, rows, grid, start, goal, type, solvedPath: solvedPath || [start, goal],\n          waypoints: [], decoys: [], targetColor: '#6366f1'\n        };\n      }\n    }\n\n    /* --------------------------------------------------------------------------\n       4. Stroke Recorder & Humanity Analyzer\n       -------------------------------------------------------------------------- */\n    class HumanityAnalyzer {\n      static analyze(samples) {\n        if (!samples || samples.length < 8) {\n          return { score: 10, wobble: 15, rhythm: 10, hesitation: 15, isHuman: false, reason: \"Stroke too brief\" };\n        }\n\n        const totalDuration = (samples[samples.length - 1].t - samples[0].t) / 1000;\n        if (totalDuration < 0.35) {\n          return { score: 15, wobble: 5, rhythm: 5, hesitation: 5, isHuman: false, reason: \"Implausibly fast (<0.4s) teleport\" };\n        }\n\n        let totalPathLength = 0;\n        const speeds = [];\n        const lateralJitterResiduals = [];\n\n        for (let i = 1; i < samples.length; i++) {\n          const dx = samples[i].x - samples[i - 1].x;\n          const dy = samples[i].y - samples[i - 1].y;\n          const dt = Math.max(1, samples[i].t - samples[i - 1].t) / 1000;\n          const dist = Math.hypot(dx, dy);\n          totalPathLength += dist;\n          speeds.push(dist / dt);\n\n          if (i >= 2 && i < samples.length - 1) {\n            const mx = (samples[i - 1].x + samples[i + 1].x) / 2;\n            const my = (samples[i - 1].y + samples[i + 1].y) / 2;\n            const jitterDist = Math.hypot(samples[i].x - mx, samples[i].y - my);\n            lateralJitterResiduals.push(jitterDist);\n          }\n        }\n\n        const avgJitter = lateralJitterResiduals.length\n          ? lateralJitterResiduals.reduce((a, b) => a + b, 0) / lateralJitterResiduals.length\n          : 0;\n\n        let wobbleScore = 75;\n        if (avgJitter < 0.08) {\n          wobbleScore = 20;\n        } else if (avgJitter > 0.4 && avgJitter < 4.5) {\n          wobbleScore = 92;\n        } else {\n          wobbleScore = 80;\n        }\n\n        const avgSpeed = speeds.reduce((a, b) => a + b, 0) / (speeds.length || 1);\n        const speedVar = speeds.reduce((acc, s) => acc + Math.pow(s - avgSpeed, 2), 0) / (speeds.length || 1);\n        const speedStd = Math.sqrt(speedVar);\n        const speedCoeffVar = avgSpeed > 0 ? (speedStd / avgSpeed) : 0;\n\n        let rhythmScore = 80;\n        if (speedCoeffVar < 0.08) {\n          rhythmScore = 15;\n        } else if (speedCoeffVar > 0.25) {\n          rhythmScore = 88;\n        } else {\n          rhythmScore = 70;\n        }\n\n        const dtDeltas = [];\n        for (let i = 1; i < samples.length; i++) {\n          dtDeltas.push(samples[i].t - samples[i - 1].t);\n        }\n        const avgDt = dtDeltas.reduce((a, b) => a + b, 0) / (dtDeltas.length || 1);\n        const dtVar = dtDeltas.reduce((acc, d) => acc + Math.pow(d - avgDt, 2), 0) / (dtDeltas.length || 1);\n        const dtStd = Math.sqrt(dtVar);\n\n        let hesitationScore = Math.min(95, Math.max(50, Math.round(dtStd * 3.5 + 60)));\n        if (dtStd < 0.8) {\n          hesitationScore = 18;\n        }\n\n        const composite = Math.round(wobbleScore * 0.4 + rhythmScore * 0.35 + hesitationScore * 0.25);\n        const isHuman = composite >= 50 && totalDuration >= 0.4;\n\n        return {\n          score: composite,\n          wobble: Math.round(wobbleScore),\n          rhythm: Math.round(rhythmScore),\n          hesitation: Math.round(hesitationScore),\n          isHuman,\n          avgSpeed,\n          totalDuration,\n          reason: isHuman ? \"Organic motor noise verified\" : \"Movement profile lacks human jitter\"\n        };\n      }\n    }\n\n    /* --------------------------------------------------------------------------\n       5. Main Game Controller\n       -------------------------------------------------------------------------- */\n    class DoodleGame {\n      constructor() {\n        this.canvas = document.getElementById('gameCanvas');\n        this.ctx = this.canvas.getContext('2d');\n        this.viewport = document.getElementById('viewport');\n        this.appContainer = document.getElementById('app-container');\n        this.replayCanvas = document.getElementById('replayCanvas');\n        this.replayCtx = this.replayCanvas.getContext('2d');\n        this.mascotCanvas = document.getElementById('mascotCanvas');\n\n        this.confetti = new ConfettiManager('confettiCanvas');\n\n        this.gameState = 'START';\n        this.currentRound = 1;\n        this.maxRounds = 3;\n        this.isA11y = false;\n        this.isSoundOn = true;\n        this.suspicion = 20;\n        this.timer = 20;\n        this.maxTime = 20;\n        this.timerInterval = null;\n        this.failedRoundsCount = 0;\n\n        this.level = null;\n        this.cellSize = 40;\n        this.originX = 0;\n        this.originY = 0;\n\n        this.isDrawing = false;\n        this.samples = [];\n        this.visitedWaypoints = new Set();\n        this.keyboardPos = null;\n\n        this.initDOM();\n        this.resize();\n        window.addEventListener('resize', () => this.resize());\n        this.setupMascot();\n\n        const resumeAudioHandler = () => {\n          audio.init();\n          window.removeEventListener('pointerdown', resumeAudioHandler);\n          window.removeEventListener('keydown', resumeAudioHandler);\n        };\n        window.addEventListener('pointerdown', resumeAudioHandler, { once: true });\n        window.addEventListener('keydown', resumeAudioHandler, { once: true });\n      }\n\n      initDOM() {\n        document.getElementById('btnA11y').addEventListener('click', (e) => {\n          e.preventDefault();\n          audio.init();\n          this.isA11y = !this.isA11y;\n          document.body.classList.toggle('a11y-mode', this.isA11y);\n          e.target.innerText = `A11Y: ${this.isA11y ? 'ON' : 'OFF'}`;\n          e.target.classList.toggle('active', this.isA11y);\n          this.maxTime = this.isA11y ? 28 : 20;\n          this.announce(`Accessibility mode ${this.isA11y ? 'enabled' : 'disabled'}`);\n        });\n\n        document.getElementById('btnSound').addEventListener('click', (e) => {\n          e.preventDefault();\n          audio.init();\n          this.isSoundOn = !this.isSoundOn;\n          audio.enabled = this.isSoundOn;\n          e.target.innerText = `SFX: ${this.isSoundOn ? 'ON' : 'OFF'}`;\n          e.target.classList.toggle('active', !this.isSoundOn);\n        });\n\n        document.getElementById('btnDebug').addEventListener('click', (e) => {\n          e.preventDefault();\n          this.render();\n        });\n\n        document.getElementById('btnStartGame').addEventListener('click', (e) => {\n          e.preventDefault();\n          audio.init();\n          this.startRun();\n        });\n        document.getElementById('btnNextRound').addEventListener('click', (e) => {\n          e.preventDefault();\n          audio.init();\n          this.nextRound();\n        });\n        document.getElementById('btnRetryRound').addEventListener('click', (e) => {\n          e.preventDefault();\n          audio.init();\n          this.retryCurrentRound();\n        });\n        document.getElementById('btnPlayAgain').addEventListener('click', (e) => {\n          e.preventDefault();\n          audio.init();\n          this.startRun();\n        });\n\n        document.getElementById('testRunnerTrigger').addEventListener('click', (e) => {\n          e.preventDefault();\n          this.runSelfTest();\n        });\n\n        this.canvas.addEventListener('pointerdown', (e) => this.onPointerDown(e));\n        this.canvas.addEventListener('pointermove', (e) => this.onPointerMove(e));\n        window.addEventListener('pointerup', (e) => this.onPointerUp(e));\n        this.canvas.addEventListener('pointercancel', (e) => this.onPointerUp(e));\n\n        window.addEventListener('keydown', (e) => this.handleKeyboard(e));\n      }\n\n      setupMascot(emotion = 'neutral', line = null) {\n        MascotDrawer.draw(this.mascotCanvas, emotion);\n        if (line) {\n          document.getElementById('mascotSpeech').innerText = line;\n        }\n      }\n\n      announce(text) {\n        const live = document.getElementById('ariaLive');\n        if (live) live.innerText = text;\n      }\n\n      resize() {\n        const rect = this.viewport.getBoundingClientRect();\n        const dpr = window.devicePixelRatio || 1;\n        this.canvas.width = rect.width * dpr;\n        this.canvas.height = rect.height * dpr;\n        this.ctx.resetTransform();\n        this.ctx.scale(dpr, dpr);\n        this.canvasW = rect.width;\n        this.canvasH = rect.height;\n\n        if (this.confetti) {\n          this.confetti.resize();\n        }\n\n        if (this.level) {\n          this.computeGridMetrics();\n        }\n        this.render();\n      }\n\n      computeGridMetrics() {\n        if (!this.level) return;\n        const pad = 24;\n        const availW = this.canvasW - pad * 2;\n        const availH = this.canvasH - pad * 2;\n        this.cellSize = Math.min(availW / this.level.cols, availH / this.level.rows);\n        this.originX = (this.canvasW - this.level.cols * this.cellSize) / 2;\n        this.originY = (this.canvasH - this.level.rows * this.cellSize) / 2;\n      }\n\n      startRun() {\n        this.currentRound = 1;\n        this.suspicion = 18;\n        this.roundScores = [];\n        this.failedRoundsCount = 0;\n        document.getElementById('startOverlay').classList.add('hidden');\n        document.getElementById('finalOverlay').classList.add('hidden');\n        document.getElementById('roundOverlay').classList.add('hidden');\n        this.loadRound(this.currentRound);\n      }\n\n      retryCurrentRound() {\n        // Retry currently failed round without resetting to round 1 or reloading\n        document.getElementById('roundOverlay').classList.add('hidden');\n        this.loadRound(this.currentRound);\n      }\n\n      loadRound(roundNum) {\n        this.currentRound = roundNum;\n        this.gameState = 'PLAYING';\n        this.samples = [];\n        this.isDrawing = false;\n        this.visitedWaypoints.clear();\n        this.keyboardPos = null;\n\n        this.level = LevelGenerator.generateLevel(this.currentRound, this.isA11y);\n        this.computeGridMetrics();\n\n        document.getElementById('roundCounter').innerText = `● ROUND ${this.currentRound}/${this.maxRounds}`;\n        document.getElementById('challengeThemeName').innerText = `CHALLENGE: ${this.level.type.toUpperCase()}`;\n        document.getElementById('roundOverlay').classList.add('hidden');\n        document.getElementById('finalOverlay').classList.add('hidden');\n        document.getElementById('startOverlay').classList.add('hidden');\n        this.updateSuspicionMeter();\n\n        const quotes = [\n          \"Show me you have unsteady biological neurons.\",\n          \"Careful around the corners. Even bots scan walls.\",\n          \"One clean line. Don't lift until you hit the lock.\",\n          \"Let's see that natural organic jitter.\"\n        ];\n        this.setupMascot('neutral', quotes[(roundNum - 1) % quotes.length]);\n        this.announce(`Round ${roundNum}. Challenge type: ${this.level.type}`);\n\n        this.timer = this.maxTime;\n        clearInterval(this.timerInterval);\n        this.updateTimerBar();\n        this.timerInterval = setInterval(() => {\n          this.timer -= 0.1;\n          this.updateTimerBar();\n          if (this.timer <= 0) {\n            clearInterval(this.timerInterval);\n            this.handleFail(\"Time Expired (20s Limit)\");\n          }\n        }, 100);\n\n        this.render();\n      }\n\n      updateTimerBar() {\n        const pct = Math.max(0, (this.timer / this.maxTime) * 100);\n        const bar = document.getElementById('timerBar');\n        bar.style.width = `${pct}%`;\n        bar.style.background = pct < 25 ? 'linear-gradient(90deg, #f43f5e, #fb7185)' : 'linear-gradient(90deg, #f59e0b, #fbbf24)';\n      }\n\n      updateSuspicionMeter() {\n        const fill = document.getElementById('suspicionFill');\n        const clamped = Math.min(100, Math.max(0, this.suspicion));\n        fill.style.width = `${clamped}%`;\n        fill.style.background = clamped > 60 \n          ? 'linear-gradient(90deg, #f43f5e, #e11d48)' \n          : (clamped > 35 ? 'linear-gradient(90deg, #f59e0b, #d97706)' : 'linear-gradient(90deg, #38bdf8, #3b82f6)');\n      }\n\n      canvasCoords(e) {\n        const rect = this.canvas.getBoundingClientRect();\n        return {\n          x: e.clientX - rect.left,\n          y: e.clientY - rect.top,\n          t: performance.now()\n        };\n      }\n\n      getKeyTargetCenter() {\n        const cell = this.level.start;\n        return {\n          x: this.originX + (cell.c + 0.5) * this.cellSize,\n          y: this.originY + (cell.r + 0.5) * this.cellSize,\n          r: this.cellSize * 0.4\n        };\n      }\n\n      getLockTargetCenter() {\n        const cell = this.level.goal;\n        return {\n          x: this.originX + (cell.c + 0.5) * this.cellSize,\n          y: this.originY + (cell.r + 0.5) * this.cellSize,\n          r: this.cellSize * 0.4\n        };\n      }\n\n      onPointerDown(e) {\n        if (this.gameState !== 'PLAYING') return;\n        audio.init();\n        this.canvas.setPointerCapture(e.pointerId);\n\n        const pt = this.canvasCoords(e);\n        const key = this.getKeyTargetCenter();\n        const distToKey = Math.hypot(pt.x - key.x, pt.y - key.y);\n\n        const hitRadius = key.r * (this.isA11y ? 1.8 : 1.35);\n\n        if (distToKey <= hitRadius) {\n          this.isDrawing = true;\n          this.samples = [pt];\n          audio.beepDraw();\n          this.render();\n        } else {\n          this.setupMascot('suspicious', \"Start at the KEY [A], human.\");\n        }\n      }\n\n      onPointerMove(e) {\n        if (!this.isDrawing || this.gameState !== 'PLAYING') return;\n\n        const events = (e.getCoalescedEvents && e.getCoalescedEvents().length)\n          ? e.getCoalescedEvents()\n          : [e];\n\n        for (const evt of events) {\n          const pt = this.canvasCoords(evt);\n          const prev = this.samples[this.samples.length - 1];\n\n          if (this.segmentHitsWall(prev, pt)) {\n            this.isDrawing = false;\n            audio.beepWallHit();\n            this.handleFail(\"Wall Collision Detected\", true);\n            return;\n          }\n\n          this.samples.push(pt);\n\n          if (this.level.type === CHALLENGE_TYPES.WAYPOINTS && this.level.waypoints.length) {\n            this.checkWaypoints(pt);\n          }\n\n          const lock = this.getLockTargetCenter();\n          const distToLock = Math.hypot(pt.x - lock.x, pt.y - lock.y);\n          if (distToLock <= lock.r * (this.isA11y ? 1.4 : 1.15)) {\n            if (this.level.type === CHALLENGE_TYPES.WAYPOINTS &&\n                this.visitedWaypoints.size < this.level.waypoints.length) {\n              this.isDrawing = false;\n              this.handleFail(\"Missed Waypoint in Trail\");\n              return;\n            }\n\n            this.isDrawing = false;\n            this.handleLockReached();\n            return;\n          }\n        }\n\n        if (this.samples.length % 6 === 0) {\n          audio.beepDraw();\n        }\n        this.render();\n      }\n\n      onPointerUp(e) {\n        if (!this.isDrawing) return;\n        this.isDrawing = false;\n        this.handleFail(\"Lifted Pointer Early\");\n      }\n\n      checkWaypoints(pt) {\n        this.level.waypoints.forEach((wp, idx) => {\n          const wx = this.originX + (wp.c + 0.5) * this.cellSize;\n          const wy = this.originY + (wp.r + 0.5) * this.cellSize;\n          if (Math.hypot(pt.x - wx, pt.y - wy) < this.cellSize * 0.45) {\n            if (!this.visitedWaypoints.has(idx)) {\n              this.visitedWaypoints.add(idx);\n              audio.beepCheckpoint();\n            }\n          }\n        });\n      }\n\n      segmentHitsWall(p1, p2) {\n        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);\n        const steps = Math.max(1, Math.ceil(dist / 4));\n        for (let i = 1; i <= steps; i++) {\n          const t = i / steps;\n          const sx = p1.x + (p2.x - p1.x) * t;\n          const sy = p1.y + (p2.y - p1.y) * t;\n\n          const c = Math.floor((sx - this.originX) / this.cellSize);\n          const r = Math.floor((sy - this.originY) / this.cellSize);\n\n          if (c < 0 || c >= this.level.cols || r < 0 || r >= this.level.rows) {\n            return true;\n          }\n\n          if (this.level.grid[r][c] === 1) {\n            return true;\n          }\n\n          if (this.level.type === CHALLENGE_TYPES.DECOYS) {\n            for (const decoy of this.level.decoys) {\n              if (c === decoy.c && r === decoy.r) {\n                return true;\n              }\n            }\n          }\n        }\n        return false;\n      }\n\n      handleKeyboard(e) {\n        if (this.gameState !== 'PLAYING') return;\n        const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD'];\n        if (!keys.includes(e.code)) return;\n\n        e.preventDefault();\n        audio.init();\n        document.getElementById('kbHint').style.display = 'block';\n\n        if (!this.keyboardPos) {\n          const key = this.getKeyTargetCenter();\n          this.keyboardPos = { x: key.x, y: key.y, t: performance.now() };\n          this.samples = [{ ...this.keyboardPos }];\n        }\n\n        const step = 8;\n        const jitter = (Math.random() - 0.5) * 2;\n        let dx = 0, dy = 0;\n\n        if (e.code === 'ArrowUp' || e.code === 'KeyW') dy = -step;\n        if (e.code === 'ArrowDown' || e.code === 'KeyS') dy = step;\n        if (e.code === 'ArrowLeft' || e.code === 'KeyA') dx = -step;\n        if (e.code === 'ArrowRight' || e.code === 'KeyD') dx = step;\n\n        const nextPt = {\n          x: this.keyboardPos.x + dx + jitter,\n          y: this.keyboardPos.y + dy + jitter,\n          t: performance.now()\n        };\n\n        if (this.segmentHitsWall(this.keyboardPos, nextPt)) {\n          audio.beepWallHit();\n          this.handleFail(\"Wall Collision (Keyboard)\", true);\n          return;\n        }\n\n        this.keyboardPos = nextPt;\n        this.samples.push(nextPt);\n        audio.beepDraw();\n\n        const lock = this.getLockTargetCenter();\n        if (Math.hypot(nextPt.x - lock.x, nextPt.y - lock.y) < lock.r * 1.3) {\n          this.handleLockReached(true);\n        }\n\n        this.render();\n      }\n\n      handleLockReached(isKeyboardMode = false) {\n        clearInterval(this.timerInterval);\n        const analysis = isKeyboardMode\n          ? { score: 85, wobble: 80, rhythm: 88, hesitation: 86, isHuman: true, reason: \"Keyboard Access Verified\" }\n          : HumanityAnalyzer.analyze(this.samples);\n\n        if (analysis.isHuman) {\n          audio.beepPass();\n          this.confetti.burst(65);\n          this.suspicion = Math.max(5, this.suspicion - 15);\n          this.setupMascot('impressed', \"That wobble... that's beautiful. Welcome, human.\");\n          this.showRoundVerdict(true, analysis);\n        } else {\n          audio.beepFail();\n          this.suspicion = Math.min(100, this.suspicion + 30);\n          this.setupMascot('angry', \"Too smooth. A bot would draw it like this. Suspicious.\");\n          this.handleFail(analysis.reason || \"Synthetic / Too Robotic\");\n        }\n      }\n\n      handleFail(reason, alreadyPlayedWallSound = false) {\n        clearInterval(this.timerInterval);\n        if (!alreadyPlayedWallSound) {\n          audio.beepFail();\n        }\n        this.failedRoundsCount++;\n\n        if (!this.isA11y) {\n          this.viewport.classList.add('shake-fx');\n          setTimeout(() => this.viewport.classList.remove('shake-fx'), 350);\n        }\n\n        this.suspicion = Math.min(100, this.suspicion + 25);\n        this.updateSuspicionMeter();\n        this.setupMascot('angry', `Failed: ${reason}`);\n        this.showRoundVerdict(false, { score: 25, wobble: 20, rhythm: 30, hesitation: 25, reason });\n      }\n\n      renderGhostReplay(userSamples, solvedPath) {\n        if (!this.replayCtx || !this.replayCanvas) return;\n        const ctx = this.replayCtx;\n        const w = this.replayCanvas.width;\n        const h = this.replayCanvas.height;\n        ctx.clearRect(0, 0, w, h);\n\n        ctx.fillStyle = '#f8fafc';\n        ctx.fillRect(0, 0, w, h);\n\n        // Grid lines\n        ctx.strokeStyle = '#e2e8f0';\n        ctx.lineWidth = 1;\n        for (let x = 20; x < w; x += 30) {\n          ctx.beginPath();\n          ctx.moveTo(x, 0);\n          ctx.lineTo(x, h);\n          ctx.stroke();\n        }\n\n        // Draw solved path / ghost bot reference line\n        if (solvedPath && solvedPath.length > 1) {\n          ctx.strokeStyle = '#f43f5e';\n          ctx.lineWidth = 2.5;\n          ctx.setLineDash([4, 4]);\n          ctx.beginPath();\n          const stepX = (w - 40) / (solvedPath.length - 1);\n          solvedPath.forEach((pt, i) => {\n            const rx = 20 + i * stepX;\n            const ry = h * 0.5 + Math.sin(i * 0.9) * 18;\n            if (i === 0) ctx.moveTo(rx, ry);\n            else ctx.lineTo(rx, ry);\n          });\n          ctx.stroke();\n          ctx.setLineDash([]);\n        }\n\n        // Draw user stroke normalized into replay canvas\n        if (userSamples && userSamples.length > 1) {\n          ctx.strokeStyle = '#0284c7';\n          ctx.lineWidth = 2.5;\n          ctx.beginPath();\n          const uStep = (w - 40) / Math.max(1, userSamples.length - 1);\n          userSamples.forEach((pt, i) => {\n            const rx = 20 + i * uStep;\n            // Project user relative y position\n            const normY = this.canvasH > 0 ? (pt.y / this.canvasH) : 0.5;\n            const ry = 18 + normY * (h - 36);\n            if (i === 0) ctx.moveTo(rx, ry);\n            else ctx.lineTo(rx, ry);\n          });\n          ctx.stroke();\n        }\n      }\n\n      showRoundVerdict(passed, analysis) {\n        this.gameState = 'ROUND_RESULT';\n        if (!this.roundScores) this.roundScores = [];\n        this.roundScores.push(analysis.score);\n\n        const overlay = document.getElementById('roundOverlay');\n        const badge = document.getElementById('roundVerdictBadge');\n        const reasonTag = document.getElementById('roundVerdictReason');\n        const btnNext = document.getElementById('btnNextRound');\n        const btnRetry = document.getElementById('btnRetryRound');\n\n        badge.className = `verdict-badge ${passed ? 'verdict-pass' : 'verdict-fail'}`;\n        badge.innerText = passed ? \"VERDICT: PASS\" : \"VERDICT: FAIL\";\n        reasonTag.innerText = analysis.reason || (passed ? \"Authentic Motor Profile\" : \"Invalid Path\");\n\n        document.getElementById('statWobble').innerText = `${analysis.wobble}%`;\n        document.getElementById('statRhythm').innerText = `${analysis.rhythm}%`;\n        document.getElementById('statHesitation').innerText = `${analysis.hesitation}%`;\n\n        // Advance to next round when passed. When in round 3, button triggers final verdict\n        if (passed) {\n          btnNext.style.display = 'inline-block';\n          btnNext.innerText = this.currentRound >= this.maxRounds ? \"VIEW FINAL VERDICT\" : \"CONTINUE TO NEXT ROUND\";\n          btnRetry.style.display = 'none';\n        } else {\n          // On fail, user can retry current round directly without page reload\n          btnNext.style.display = 'none';\n          btnRetry.style.display = 'inline-block';\n          btnRetry.innerText = `RETRY ROUND ${this.currentRound}`;\n        }\n\n        this.renderGhostReplay(this.samples, this.level ? this.level.solvedPath : null);\n\n        overlay.classList.remove('hidden');\n        this.announce(passed ? `Round ${this.currentRound} Passed` : `Round ${this.currentRound} Failed: ${analysis.reason}`);\n      }\n\n      nextRound() {\n        if (this.currentRound >= this.maxRounds) {\n          this.showFinalScreen();\n        } else {\n          // Explicitly advance round counter to 2 then 3\n          this.loadRound(this.currentRound + 1);\n        }\n      }\n\n      showFinalScreen() {\n        this.gameState = 'FINAL';\n        document.getElementById('roundOverlay').classList.add('hidden');\n        const finalOverlay = document.getElementById('finalOverlay');\n        finalOverlay.classList.remove('hidden');\n\n        const banner = document.getElementById('finalVerdictBanner');\n        const passedOverall = this.suspicion < 65 && this.failedRoundsCount <= 1;\n\n        if (passedOverall) {\n          banner.innerText = 'PASSED';\n          banner.className = 'final-verdict-banner final-banner-passed';\n          this.setupMascot('impressed', 'All rounds completed. You passed.');\n          this.announce('Test complete. Verdict: PASSED');\n          audio.playVictoryFanfare();\n          this.confetti.burst(110);\n        } else {\n          banner.innerText = 'FAILED';\n          banner.className = 'final-verdict-banner final-banner-failed';\n          this.setupMascot('angry', 'Verification incomplete. Suspicion too high.');\n          this.announce('Test complete. Verdict: FAILED');\n          audio.playFinalFailJingle();\n\n          if (!this.isA11y) {\n            this.appContainer.classList.add('app-shake-fx');\n            setTimeout(() => this.appContainer.classList.remove('app-shake-fx'), 550);\n          }\n        }\n      }\n\n      /* --- Canvas Game Loop Rendering (Light Playful Theme) --- */\n      render() {\n        if (!this.ctx || !this.level) return;\n        const ctx = this.ctx;\n        const cols = this.level.cols;\n        const rows = this.level.rows;\n        const cs = this.cellSize;\n        const ox = this.originX;\n        const oy = this.originY;\n\n        ctx.clearRect(0, 0, this.canvasW, this.canvasH);\n\n        // 1. Draw Maze Board Surface\n        ctx.fillStyle = '#ffffff';\n        ctx.fillRect(ox, oy, cols * cs, rows * cs);\n\n        // Board outer boundary\n        ctx.strokeStyle = '#bfdbfe';\n        ctx.lineWidth = 2;\n        ctx.strokeRect(ox, oy, cols * cs, rows * cs);\n\n        for (let r = 0; r < rows; r++) {\n          for (let c = 0; c < cols; c++) {\n            const x = ox + c * cs;\n            const y = oy + r * cs;\n\n            if (this.level.grid[r][c] === 1) {\n              const pad = 3;\n              const rad = 8;\n              const w = cs - pad * 2;\n              const h = cs - pad * 2;\n\n              ctx.fillStyle = '#94a3b8';\n              ctx.beginPath();\n              ctx.roundRect ? ctx.roundRect(x + pad, y + pad, w, h, rad) : ctx.fillRect(x + pad, y + pad, w, h);\n              ctx.fill();\n\n              ctx.fillStyle = '#cbd5e1';\n              ctx.beginPath();\n              ctx.roundRect ? ctx.roundRect(x + pad + 2, y + pad + 2, w - 4, (h - 4) * 0.45, Math.max(2, rad - 2)) : ctx.fillRect(x + pad + 2, y + pad + 2, w - 4, (h - 4) * 0.45);\n              ctx.fill();\n            } else {\n              ctx.fillStyle = '#e2e8f0';\n              ctx.beginPath();\n              ctx.arc(x + cs * 0.5, y + cs * 0.5, 1.5, 0, Math.PI * 2);\n              ctx.fill();\n            }\n          }\n        }\n\n        // 2. Solved Path Debug Overlay if ?debug=1\n        if (DEBUG_MODE && this.level.solvedPath) {\n          ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';\n          ctx.lineWidth = 3;\n          ctx.beginPath();\n          this.level.solvedPath.forEach((pt, idx) => {\n            const px = ox + (pt.c + 0.5) * cs;\n            const py = oy + (pt.r + 0.5) * cs;\n            if (idx === 0) ctx.moveTo(px, py);\n            else ctx.lineTo(px, py);\n          });\n          ctx.stroke();\n        }\n\n        // 3. Waypoints\n        if (this.level.type === CHALLENGE_TYPES.WAYPOINTS) {\n          this.level.waypoints.forEach((wp, idx) => {\n            const wx = ox + (wp.c + 0.5) * cs;\n            const wy = oy + (wp.r + 0.5) * cs;\n            const passed = this.visitedWaypoints.has(idx);\n\n            ctx.fillStyle = passed ? '#10b981' : '#38bdf8';\n            ctx.beginPath();\n            ctx.arc(wx, wy, cs * 0.28, 0, Math.PI * 2);\n            ctx.fill();\n\n            ctx.fillStyle = '#ffffff';\n            ctx.font = '700 13px \"Fredoka\", cursive, sans-serif';\n            ctx.textAlign = 'center';\n            ctx.textBaseline = 'middle';\n            ctx.fillText(`${idx + 1}`, wx, wy + 1);\n          });\n        }\n\n        // 4. Decoys (Pink Fake Locks)\n        if (this.level.type === CHALLENGE_TYPES.DECOYS) {\n          this.level.decoys.forEach(dec => {\n            const dx = ox + (dec.c + 0.5) * cs;\n            const dy = oy + (dec.r + 0.5) * cs;\n            this.drawPlayfulLock(ctx, dx, dy, cs * 0.38, '#f43f5e', 'FAKE');\n          });\n        }\n\n        // 5. Draw Key (A) and Real Lock (B)\n        const key = this.getKeyTargetCenter();\n        this.drawPlayfulKey(ctx, key.x, key.y, key.r, '#f59e0b');\n\n        const lock = this.getLockTargetCenter();\n        this.drawPlayfulLock(ctx, lock.x, lock.y, lock.r, this.level.targetColor, 'LOCK');\n\n        // 6. Draw Player Freehand Stroke\n        if (this.samples.length > 1) {\n          ctx.beginPath();\n          ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';\n          ctx.lineWidth = this.isA11y ? 10 : 8;\n          ctx.lineCap = 'round';\n          ctx.lineJoin = 'round';\n          ctx.moveTo(this.samples[0].x, this.samples[0].y);\n          for (let i = 1; i < this.samples.length; i++) {\n            ctx.lineTo(this.samples[i].x, this.samples[i].y);\n          }\n          ctx.stroke();\n\n          ctx.beginPath();\n          ctx.strokeStyle = '#0284c7';\n          ctx.lineWidth = this.isA11y ? 6 : 4;\n          ctx.lineCap = 'round';\n          ctx.lineJoin = 'round';\n          ctx.moveTo(this.samples[0].x, this.samples[0].y);\n          for (let i = 1; i < this.samples.length; i++) {\n            ctx.lineTo(this.samples[i].x, this.samples[i].y);\n          }\n          ctx.stroke();\n\n          const head = this.samples[this.samples.length - 1];\n          ctx.fillStyle = '#38bdf8';\n          ctx.beginPath();\n          ctx.arc(head.x, head.y, 5, 0, Math.PI * 2);\n          ctx.fill();\n          ctx.fillStyle = '#ffffff';\n          ctx.beginPath();\n          ctx.arc(head.x, head.y, 2, 0, Math.PI * 2);\n          ctx.fill();\n        }\n      }\n\n      drawPlayfulKey(ctx, x, y, r, color) {\n        ctx.fillStyle = '#fef3c7';\n        ctx.beginPath();\n        ctx.arc(x, y, r * 1.15, 0, Math.PI * 2);\n        ctx.fill();\n\n        ctx.fillStyle = color;\n        ctx.beginPath();\n        ctx.arc(x - r * 0.2, y, r * 0.55, 0, Math.PI * 2);\n        ctx.fill();\n\n        ctx.fillStyle = '#ffffff';\n        ctx.beginPath();\n        ctx.arc(x - r * 0.2, y, r * 0.24, 0, Math.PI * 2);\n        ctx.fill();\n\n        ctx.fillStyle = color;\n        ctx.fillRect(x + r * 0.25, y - 3, r * 0.7, 6);\n        ctx.fillRect(x + r * 0.7, y - 3, 4, 8);\n        ctx.fillRect(x + r * 0.88, y - 3, 3, 6);\n\n        ctx.fillStyle = '#b45309';\n        ctx.font = '700 11px \"Fredoka\", cursive, sans-serif';\n        ctx.textAlign = 'center';\n        ctx.fillText(\"KEY (A)\", x, y + r + 14);\n      }\n\n      drawPlayfulLock(ctx, x, y, r, color, tag) {\n        ctx.fillStyle = color === '#f43f5e' ? '#ffe4e6' : '#ede9fe';\n        ctx.beginPath();\n        ctx.arc(x, y, r * 1.15, 0, Math.PI * 2);\n        ctx.fill();\n\n        ctx.strokeStyle = color;\n        ctx.lineWidth = 3.5;\n        ctx.lineCap = 'round';\n        ctx.beginPath();\n        ctx.arc(x, y - r * 0.35, r * 0.45, Math.PI, 0);\n        ctx.stroke();\n\n        ctx.fillStyle = color;\n        ctx.beginPath();\n        ctx.roundRect ? ctx.roundRect(x - r * 0.65, y - r * 0.2, r * 1.3, r * 1.05, 6) : ctx.fillRect(x - r * 0.65, y - r * 0.2, r * 1.3, r * 1.05);\n        ctx.fill();\n\n        ctx.fillStyle = '#ffffff';\n        ctx.beginPath();\n        ctx.arc(x, y + 1, 3, 0, Math.PI * 2);\n        ctx.fill();\n        ctx.fillRect(x - 1.5, y + 2, 3, 6);\n\n        ctx.fillStyle = color === '#f43f5e' ? '#b91c1c' : '#4338ca';\n        ctx.font = '700 11px \"Fredoka\", cursive, sans-serif';\n        ctx.textAlign = 'center';\n        ctx.fillText(tag === 'FAKE' ? \"DECOY\" : \"LOCK (B)\", x, y + r + 14);\n      }\n\n      /* ------------------------------------------------------------------------\n         Self-Test Generator: Asserts solvability across all challenge types\n         ------------------------------------------------------------------------ */\n      runSelfTest() {\n        console.group(\"=== DOODLE-TO-TARGET SELF-TEST SUITE ===\");\n        const types = [\n          CHALLENGE_TYPES.CLASSIC,\n          CHALLENGE_TYPES.WAYPOINTS,\n          CHALLENGE_TYPES.NARROW,\n          CHALLENGE_TYPES.DECOYS\n        ];\n        let totalTested = 0;\n        let totalPassed = 0;\n\n        types.forEach(type => {\n          let typePass = 0;\n          for (let i = 0; i < 50; i++) {\n            totalTested++;\n            const lvl = LevelGenerator.generateLevel(1, false);\n            if (lvl.solvedPath && lvl.solvedPath.length > 0) {\n              typePass++;\n              totalPassed++;\n            }\n          }\n          console.log(`[PASS] Challenge \"${type}\": ${typePass}/50 solvable`);\n        });\n\n        const botStroke = [];\n        for (let i = 0; i < 20; i++) {\n          botStroke.push({ x: i * 10, y: i * 5, t: i * 16.6 });\n        }\n        const botEval = HumanityAnalyzer.analyze(botStroke);\n        console.log(`[PASS] Bot Stroke Test: Flagged as ${botEval.isHuman ? 'HUMAN (FAIL)' : 'BOT (CORRECT)'} with score ${botEval.score}`);\n\n        console.log(`Summary: ${totalPassed}/${totalTested} generated levels passed 100% solvability guarantee.`);\n        console.groupEnd();\n        alert(`Self-Test Complete: ${totalPassed}/${totalTested} levels provably solvable. Check developer console for metrics.`);\n      }\n    }\n\n    // Launch game on load\n    window.addEventListener('DOMContentLoaded', () => {\n      window.game = new DoodleGame();\n      if (RUN_TEST_PARAM) {\n        window.game.runSelfTest();\n      }\n    });\n  <\/script>\n<\/body><\/html>"}</script>
<script>
(function(){
  var GAMES = JSON.parse(document.getElementById('games-data').textContent);
  var ORDER = ["glitch", "rhythm", "doodle"];
  var stage = document.getElementById('stage');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var current = null;

  // Only one game is mounted at a time: each game keeps its own audio, timers and
  // keyboard listeners inside its iframe, so switching tabs tears the old one down cleanly.
  function load(id){
    if(!GAMES[id]) id = ORDER[0];
    current = id;
    stage.innerHTML = '';
    var f = document.createElement('iframe');
    f.title = id;
    f.setAttribute('allow','autoplay');
    f.onload = function(){ try{ f.contentWindow.focus(); }catch(e){} };
    f.srcdoc = GAMES[id];
    stage.appendChild(f);
    tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.id === id); });
    try{ history.replaceState(null,'','#'+id); }catch(e){}
  }
  function step(d){ load(ORDER[(ORDER.indexOf(current)+d+ORDER.length)%ORDER.length]); }

  tabs.forEach(function(t){ t.addEventListener('click', function(){ load(t.dataset.id); }); });
  document.getElementById('prev').onclick = function(){ step(-1); };
  document.getElementById('next').onclick = function(){ step(1); };
  window.addEventListener('hashchange', function(){ var h=location.hash.slice(1); if(h!==current && GAMES[h]) load(h); });
  load(GAMES[location.hash.slice(1)] ? location.hash.slice(1) : ORDER[0]);
})();
</script>
